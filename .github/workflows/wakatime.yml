name: Waka Readme

on:
  schedule:
    # Runs at 12am IST
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOCALE: zh
          SECTION_NAME: waka
          SHOW_EDITORS: false
          SHOW_OS: false
          SHOW_PROJECTS: false # 隐藏项目数据（GitHub相关）
          SYMBOL_VERSION: "2" # 设置为进度条的符号
          SHOW_SHORT_INFO: "False" # 用户的简短趣闻信息
          SHOW_LOC_CHART: "False" # 年份不同季度编写的代码行数
          SHOW_PROFILE_VIEWS: "False" # 年份不同季度编写的代码行数
          SHOW_DAYS_OF_WEEK: "False" # 周
          SHOW_TIMEZONE: "False" # 周
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"


